intro:
  label: About my work
  heading: Connecting individual energetics to marine ecosystem change
  paragraph_one: My research focuses on how marine predators respond to
    environmental variability, energetic constraints, and human impacts.
  paragraph_two: I combine field observations, aerial photogrammetry, biologging,
    stable isotopes, movement data, and statistical modeling to study whales,
    penguins, and other marine wildlife.
