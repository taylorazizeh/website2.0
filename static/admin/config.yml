backend:
  name: github
  repo: taylorazizeh/website2.0
  branch: main
  base_url: https://taylor-decap-auth.taylorazizeh.workers.dev
  auth_endpoint: /auth

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_pages"
    label: "Website Pages"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "data/home.yml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small heading", name: "eyebrow", widget: "string" }
              - { label: "Main heading", name: "title", widget: "string" }
              - { label: "Introduction", name: "description", widget: "text" }
              - { label: "Primary button text", name: "primary_button_text", widget: "string" }
              - { label: "Primary button link", name: "primary_button_link", widget: "string" }
              - { label: "Secondary button text", name: "secondary_button_text", widget: "string" }
              - { label: "Secondary button link", name: "secondary_button_link", widget: "string" }
              - label: "Title size"
                name: "title_size"
                widget: "select"
                options:
                  - { label: "Small", value: "small" }
                  - { label: "Medium", value: "medium" }
                  - { label: "Large", value: "large" }
                default: "medium"

              - label: "Headshot size"
                name: "photo_size"
                widget: "select"
                options:
                  - { label: "Small", value: "small" }
                  - { label: "Medium", value: "medium" }
                  - { label: "Large", value: "large" }
                  - { label: "Extra large", value: "xlarge" }
                default: "large"

          - label: "About section"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Section label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "First paragraph", name: "paragraph_one", widget: "text" }
              - { label: "Second paragraph", name: "paragraph_two", widget: "text" }
              - { label: "Link text", name: "link_text", widget: "string" }
              - { label: "Link URL", name: "link_url", widget: "string" }

          - label: "Contact section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Section label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Button text", name: "button_text", widget: "string" }
              - { label: "Button link", name: "button_link", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "content/about.md"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Page description", name: "description", widget: "text" }
          - { label: "Page image", name: "image", widget: "image", required: false }

          - label: "Title size"
            name: "title_size"
            widget: "select"
            options:
              - { label: "Small", value: "small" }
              - { label: "Medium", value: "medium" }
              - { label: "Large", value: "large" }
            default: "medium"

          - label: "Image size"
            name: "image_size"
            widget: "select"
            options:
              - { label: "Small", value: "small" }
              - { label: "Medium", value: "medium" }
              - { label: "Large", value: "large" }
              - { label: "Full width", value: "full" }
            default: "large"

          - label: "Image alignment"
            name: "image_alignment"
            widget: "select"
            options:
              - { label: "Left", value: "left" }
              - { label: "Center", value: "center" }
              - { label: "Right", value: "right" }
            default: "center"

          - label: "Text width"
            name: "content_width"
            widget: "select"
            options:
              - { label: "Narrow", value: "narrow" }
              - { label: "Normal", value: "normal" }
              - { label: "Wide", value: "wide" }
            default: "normal"


          - label: "Text alignment"
            name: "text_alignment"
            widget: "select"
            options:
              - { label: "Left", value: "left" }
              - { label: "Center", value: "center" }
              - { label: "Justified", value: "justify" }
            default: "left"

          - label: "Photos after text"
            name: "after_images"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }

              - label: "Photo size"
                name: "size"
                widget: "select"
                options:
                  - { label: "Small", value: "small" }
                  - { label: "Medium", value: "medium" }
                  - { label: "Large", value: "large" }
                  - { label: "Full width", value: "full" }
                default: "medium"

              - label: "Photo alignment"
                name: "alignment"
                widget: "select"
                options:
                  - { label: "Left", value: "left" }
                  - { label: "Center", value: "center" }
                  - { label: "Right", value: "right" }
                default: "center"

              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Alt text", name: "alt", widget: "string", required: false }

          - { label: "Page content", name: "body", widget: "markdown" }

      - name: "research_landing"
        label: "Research Landing Page"
        file: "content/research/_index.md"
        fields:
          - label: "Page title"
            name: "title"
            widget: "string"

          - label: "Page description"
            name: "description"
            widget: "text"

          - label: "Introductory image"
            name: "image"
            widget: "image"
            required: false

          - label: "Page content"
            name: "body"
            widget: "markdown"
            required: false

          - label: "Draft"
            name: "draft"
            widget: "hidden"
            default: false

      - name: "contact"
        label: "Contact Page"
        file: "content/contact.md"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Page description", name: "description", widget: "text" }

          - label: "Title size"
            name: "title_size"
            widget: "select"
            options:
              - { label: "Small", value: "small" }
              - { label: "Medium", value: "medium" }
              - { label: "Large", value: "large" }
            default: "medium"

          - label: "Text width"
            name: "content_width"
            widget: "select"
            options:
              - { label: "Narrow", value: "narrow" }
              - { label: "Normal", value: "normal" }
              - { label: "Wide", value: "wide" }
            default: "normal"


          - label: "Text alignment"
            name: "text_alignment"
            widget: "select"
            options:
              - { label: "Left", value: "left" }
              - { label: "Center", value: "center" }
              - { label: "Justified", value: "justify" }
            default: "left"

          - label: "Photos after text"
            name: "after_images"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }

              - label: "Photo size"
                name: "size"
                widget: "select"
                options:
                  - { label: "Small", value: "small" }
                  - { label: "Medium", value: "medium" }
                  - { label: "Large", value: "large" }
                  - { label: "Full width", value: "full" }
                default: "medium"

              - label: "Photo alignment"
                name: "alignment"
                widget: "select"
                options:
                  - { label: "Left", value: "left" }
                  - { label: "Center", value: "center" }
                  - { label: "Right", value: "right" }
                default: "center"

              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Alt text", name: "alt", widget: "string", required: false }

          - { label: "Page content", name: "body", widget: "markdown" }

      - name: "photography"
        label: "Photography Page"
        file: "content/photography.md"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Page description", name: "description", widget: "text" }
          - { label: "Featured image", name: "image", widget: "image", required: false }

          - label: "Title size"
            name: "title_size"
            widget: "select"
            options:
              - { label: "Small", value: "small" }
              - { label: "Medium", value: "medium" }
              - { label: "Large", value: "large" }
            default: "medium"

          - label: "Featured image size"
            name: "image_size"
            widget: "select"
            options:
              - { label: "Small", value: "small" }
              - { label: "Medium", value: "medium" }
              - { label: "Large", value: "large" }
              - { label: "Full width", value: "full" }
            default: "large"

          - label: "Text width"
            name: "content_width"
            widget: "select"
            options:
              - { label: "Narrow", value: "narrow" }
              - { label: "Normal", value: "normal" }
              - { label: "Wide", value: "wide" }
            default: "normal"

          - label: "Gallery columns"
            name: "gallery_columns"
            widget: "select"
            options:
              - { label: "One column", value: "1" }
              - { label: "Two columns", value: "2" }
              - { label: "Three columns", value: "3" }
              - { label: "Four columns", value: "4" }
            default: "2"

          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Alt text", name: "alt", widget: "string", required: false }

          - label: "Text alignment"
            name: "text_alignment"
            widget: "select"
            options:
              - { label: "Left", value: "left" }
              - { label: "Center", value: "center" }
              - { label: "Justified", value: "justify" }
            default: "left"

          - label: "Photos after text"
            name: "after_images"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }

              - label: "Photo size"
                name: "size"
                widget: "select"
                options:
                  - { label: "Small", value: "small" }
                  - { label: "Medium", value: "medium" }
                  - { label: "Large", value: "large" }
                  - { label: "Full width", value: "full" }
                default: "medium"

              - label: "Photo alignment"
                name: "alignment"
                widget: "select"
                options:
                  - { label: "Left", value: "left" }
                  - { label: "Center", value: "center" }
                  - { label: "Right", value: "right" }
                default: "center"

              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Alt text", name: "alt", widget: "string", required: false }

          - { label: "Page content", name: "body", widget: "markdown" }

  - name: "research"
    label: "Research Projects"
    label_singular: "Research Project"
    folder: "content/research"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}"
    filter:
      field: "content_type"
      value: "research_project"

    fields:
      - label: "Content type"
        name: "content_type"
        widget: "hidden"
        default: "research_project"

      - label: "Project title"
        name: "title"
        widget: "string"

      - label: "Short description"
        name: "description"
        widget: "text"

      - label: "Featured image"
        name: "image"
        widget: "image"
        required: false

      - label: "Title size"
        name: "title_size"
        widget: "select"
        options:
          - { label: "Small", value: "small" }
          - { label: "Medium", value: "medium" }
          - { label: "Large", value: "large" }
        default: "medium"

      - label: "Image size"
        name: "image_size"
        widget: "select"
        options:
          - { label: "Small", value: "small" }
          - { label: "Medium", value: "medium" }
          - { label: "Large", value: "large" }
          - { label: "Full width", value: "full" }
        default: "large"

      - label: "Text width"
        name: "content_width"
        widget: "select"
        options:
          - { label: "Narrow", value: "narrow" }
          - { label: "Normal", value: "normal" }
          - { label: "Wide", value: "wide" }
        default: "normal"


      - label: "Text alignment"
        name: "text_alignment"
        widget: "select"
        options:
          - { label: "Left", value: "left" }
          - { label: "Center", value: "center" }
          - { label: "Justified", value: "justify" }
        default: "left"

      - label: "Photos after text"
        name: "after_images"
        widget: "list"
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Photo", name: "image", widget: "image" }

          - label: "Photo size"
            name: "size"
            widget: "select"
            options:
              - { label: "Small", value: "small" }
              - { label: "Medium", value: "medium" }
              - { label: "Large", value: "large" }
              - { label: "Full width", value: "full" }
            default: "medium"

          - label: "Photo alignment"
            name: "alignment"
            widget: "select"
            options:
              - { label: "Left", value: "left" }
              - { label: "Center", value: "center" }
              - { label: "Right", value: "right" }
            default: "center"

          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Alt text", name: "alt", widget: "string", required: false }

      - label: "Project content"
        name: "body"
        widget: "markdown"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

  - name: "publications"
    label: "Publications"
    label_singular: "Publication"
    folder: "content/publications"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{slug}}"
    summary: "{{year}} — {{title}}"
    filter:
      field: "title"
      value: "Publications"
      complement: true

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Authors"
        name: "authors"
        widget: "text"

      - label: "Journal"
        name: "journal"
        widget: "string"

      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 1900
        max: 2100

      - label: "Volume"
        name: "volume"
        widget: "string"
        required: false

      - label: "Pages"
        name: "pages"
        widget: "string"
        required: false

      - label: "Publication date"
        name: "publication_date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false

      - label: "DOI or publication URL"
        name: "doi"
        widget: "string"
        required: false

      - label: "PDF"
        name: "pdf"
        widget: "file"
        required: false

      - label: "Show on homepage"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Description or abstract"
        name: "body"
        widget: "markdown"
        required: false

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
