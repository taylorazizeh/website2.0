backend:
  name: github
  repo: taylorazizeh/website2.0
  branch: main
  base_url: https://taylor-decap-auth.taylorazizeh.workers.dev
  auth_endpoint: /auth

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_pages"
    label: "Website Pages"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "data/home.yml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small heading", name: "eyebrow", widget: "string" }
              - { label: "Main heading", name: "title", widget: "string" }
              - { label: "Introduction", name: "description", widget: "text" }
              - { label: "Primary button text", name: "primary_button_text", widget: "string" }
              - { label: "Primary button link", name: "primary_button_link", widget: "string" }
              - { label: "Secondary button text", name: "secondary_button_text", widget: "string" }
              - { label: "Secondary button link", name: "secondary_button_link", widget: "string" }

          - label: "About section"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Section label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "First paragraph", name: "paragraph_one", widget: "text" }
              - { label: "Second paragraph", name: "paragraph_two", widget: "text" }
              - { label: "Link text", name: "link_text", widget: "string" }
              - { label: "Link URL", name: "link_url", widget: "string" }

          - label: "Contact section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Section label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Button text", name: "button_text", widget: "string" }
              - { label: "Button link", name: "button_link", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "content/about.md"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Page description", name: "description", widget: "text" }
          - { label: "Page content", name: "body", widget: "markdown" }

      - name: "contact"
        label: "Contact Page"
        file: "content/contact.md"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Page description", name: "description", widget: "text" }
          - { label: "Page content", name: "body", widget: "markdown" }

      - name: "photography"
        label: "Photography Page"
        file: "content/photography.md"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Page description", name: "description", widget: "text" }
          - { label: "Page content", name: "body", widget: "markdown" }

  - name: "research"
    label: "Research Projects"
    label_singular: "Research Project"
    folder: "content/research"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}"
    filter:
      field: "title"
      value: "Research"
      complement: true

    fields:
      - label: "Project title"
        name: "title"
        widget: "string"

      - label: "Short description"
        name: "description"
        widget: "text"

      - label: "Featured image"
        name: "image"
        widget: "image"
        required: false

      - label: "Project content"
        name: "body"
        widget: "markdown"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

  - name: "publications"
    label: "Publications"
    label_singular: "Publication"
    folder: "content/publications"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{slug}}"
    summary: "{{year}} — {{title}}"
    filter:
      field: "title"
      value: "Publications"
      complement: true

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Authors"
        name: "authors"
        widget: "text"

      - label: "Journal"
        name: "journal"
        widget: "string"

      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 1900
        max: 2100

      - label: "Volume"
        name: "volume"
        widget: "string"
        required: false

      - label: "Pages"
        name: "pages"
        widget: "string"
        required: false

      - label: "Publication date"
        name: "publication_date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false

      - label: "DOI or publication URL"
        name: "doi"
        widget: "string"
        required: false

      - label: "PDF"
        name: "pdf"
        widget: "file"
        required: false

      - label: "Show on homepage"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Description or abstract"
        name: "body"
        widget: "markdown"
        required: false

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
